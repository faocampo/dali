{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "dali-boundary"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app": "dali"
      }
    },
    "policyTypes": [
      "Ingress",
      "Egress"
    ],
    "ingress": [
      {
        "from": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "dali.example.org/ingress": "allowed"
              }
            },
            "podSelector": {
              "matchLabels": {
                "dali.example.org/role": "ingress"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 8080
          }
        ]
      }
    ],
    "egress": [
      {
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "kube-system"
              }
            },
            "podSelector": {
              "matchLabels": {
                "k8s-app": "kube-dns"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "UDP",
            "port": 53
          },
          {
            "protocol": "TCP",
            "port": 53
          }
        ]
      },
      {
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "dali.example.org/oidc": "allowed"
              }
            },
            "podSelector": {
              "matchLabels": {
                "dali.example.org/role": "oidc"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 443
          }
        ]
      }
    ]
  }
}
