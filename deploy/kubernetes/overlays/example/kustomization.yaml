{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "resources": [
    "../../base",
    "ingress.yaml"
  ],
  "images": [
    {
      "name": "dali-app",
      "newName": "registry.example.org/dali-app",
      "newTag": "release"
    },
    {
      "name": "dali-web",
      "newName": "registry.example.org/dali-web",
      "newTag": "release"
    }
  ],
  "patches": [
    {
      "target": {
        "kind": "PersistentVolumeClaim",
        "name": "dali-live"
      },
      "patch": "[{\"op\":\"replace\",\"path\":\"/spec/storageClassName\",\"value\":\"operator-live-csi\"}]"
    },
    {
      "target": {
        "kind": "PersistentVolumeClaim",
        "name": "dali-backup"
      },
      "patch": "[{\"op\":\"replace\",\"path\":\"/spec/storageClassName\",\"value\":\"operator-independent-backup-csi\"}]"
    },
    {
      "target": {
        "kind": "Deployment",
        "name": "dali"
      },
      "patch": "[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/resources/requests/memory\",\"value\":\"512Mi\"}]"
    }
  ]
}
